<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact | Biench Pavia</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', sans-serif; }
        :root { --primary: #5b8c8c; --secondary: #e0a574; --light: #f8f6f2; --dark: #444; --card: #fff; }
        body { background: var(--light); min-height: 100vh; padding-bottom: 90px; color: var(--dark); }
        .back-link { display: inline-block; margin: 20px; color: var(--primary); text-decoration: none; }
        .back-link i { margin-right: 5px; }
        .page-header { text-align: center; padding: 20px 20px 30px; }
        .page-header h2 { color: var(--primary); font-size: 1.8rem; }
        .container { max-width: 500px; margin: 0 auto; padding: 0 20px; }
        .contact-card { background: var(--card); border-radius: 16px; padding: 25px; margin-bottom: 15px; box-shadow: 0 4px 15px rgba(91,140,140,0.08); }
        .contact-card h3 { color: var(--secondary); margin-bottom: 15px; font-size: 1.1rem; }
        .contact-item { display: flex; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--light); }
        .contact-item:last-child { border-bottom: none; }
        .contact-item i { color: var(--primary); font-size: 20px; width: 30px; text-align: center; margin-right: 15px; }
        .contact-item span { color: #555; font-size: 0.95rem; }
        .contact-item a { color: var(--primary); text-decoration: none; }
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; background: #fff; display: flex; justify-content: space-around; padding: 12px 10px 20px; box-shadow: 0 -2px 15px rgba(0,0,0,0.05); z-index: 100; }
        .bot-nav-item { display: flex; flex-direction: column; align-items: center; color: #aaa; text-decoration: none; }
        .bot-nav-item.active, .bot-nav-item:hover { color: var(--primary); }
        .bot-nav-item i { font-size: 18px; margin-bottom: 3px; }
        .bot-nav-item span { font-size: 0.6rem; }
    </style>
</head>
<body>
    <a href="index.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Home</a>

    <div class="page-header">
        <h2><i class="fas fa-envelope"></i> Contact Me</h2>
    </div>

    <div class="container">
        <div class="contact-card">
            <h3>Get In Touch</h3>
            <div class="contact-item">
                <i class="fas fa-phone"></i>
                <span>0992 726 9498</span>
            </div>
            <div class="contact-item">
                <i class="fas fa-envelope"></i>
                <span><a href="mailto:bugoypavia19@gmail.com">bugoypavia19@gmail.com</a></span>
            </div>
            <div class="contact-item">
                <i class="fab fa-facebook"></i>
                <span><a href="#" target="_blank">Biench Pavia</a></span>
            </div>
        </div>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bot-nav-item">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="works.html" class="bot-nav-item">
            <i class="fas fa-book"></i>
            <span>Works</span>
        </a>
        <a href="projects.html" class="bot-nav-item">
            <i class="fas fa-th-large"></i>
            <span>More</span>
        </a>
        <a href="contact.html" class="bot-nav-item active">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
        </a>
    </nav>
</body>
</html>
