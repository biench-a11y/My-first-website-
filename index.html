<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Biench Pavia | Portfolio</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', sans-serif;
        }
        body {
            background: #f8f6f2;
            color: #444;
            line-height: 1.6;
            text-align: center;
            padding: 40px 20px;
        }
        nav {
            margin-bottom: 50px;
        }
        nav a {
            color: #5b8c8c;
            text-decoration: none;
            margin: 0 15px;
            font-size: 16px;
        }
        nav a:hover {
            color: #e0a574;
        }
        .profile-img {
            width: 180px;
            height: 180px;
            border-radius: 50%;
            border: 4px solid #5b8c8c;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 3em;
            color: #333;
            margin-bottom: 5px;
        }
        .subtitle {
            color: #5b8c8c;
            font-size: 1.2em;
            letter-spacing: 3px;
            margin-bottom: 30px;
        }
        .intro {
            max-width: 500px;
            margin: 0 auto 50px;
            font-size: 18px;
            color: #666;
            line-height: 1.8;
        }
        .buttons {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            max-width: 500px;
            margin: 0 auto;
        }
        .btn-card {
            background: white;
            padding: 30px 15px;
            border-radius: 16px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            text-decoration: none;
            color: #444;
            transition: 0.3s;
        }
        .btn-card:hover {
            transform: translateY(-5px);
        }
        .btn-card span {
            font-size: 32px;
            display: block;
            margin-bottom: 10px;
        }
    </style>
</head>
<body>

    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About Me</a>
        <a href="works.html">My Works</a>
        <a href="contact.html">Contact</a>
    </nav>

    <img src="profile.jpg" alt="Biench Pavia" class="profile-img">
    <h1>Biench Pavia</h1>
    <p class="subtitle">STUDENT • CREATOR</p>
    
    <p class="intro">
        Welcome to my personal space — a collection of my works, projects, and journey.
    </p>

    <div class="buttons">
        <a href="about.html" class="btn-card">
            <span>👤</span>
            <strong>About Me</strong>
        </a>
        <a href="works.html" class="btn-card">
            <span>✏️</span>
            <strong>My Works</strong>
        </a>
        <a href="projects.html" class="btn-card">
            <span>📁</span>
            <strong>Projects</strong>
        </a>
        <a href="contact.html" class="btn-card">
            <span>✉️</span>
            <strong>Contact</strong>
        </a>
    </div>

</body>
</html>
