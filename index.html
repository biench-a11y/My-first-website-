<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio | Welcome</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', 'Helvetica Neue', sans-serif;
        }

        :root {
            --primary: #5b8c8c;
            --secondary: #e0a574;
            --light: #f8f6f2;
            --dark: #444444;
            --card: #ffffff;
            --shadow: rgba(91, 140, 140, 0.08);
        }

        body {
            background: var(--light);
            min-height: 100vh;
            color: var(--dark);
            padding-bottom: 90px;
        }

        .hero {
            text-align: center;
            padding: 60px 30px 40px;
            animation: fadeIn 0.8s ease;
        }

        .profile-wrap {
            width: 120px;
            height: 120px;
            margin: 0 auto 25px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 4px;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid var(--light);
        }

        h1 {
            font-size: 2.2rem;
            color: var(--dark);
            margin-bottom: 8px;
            font-weight: 600;
        }

        .tagline {
            color: var(--primary);
            font-size: 1rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .intro-text {
            max-width: 380px;
            margin: 15px auto 0;
            font-size: 0.95rem;
            color: #777;
            line-height: 1.6;
        }

        .nav-grid {
            max-width: 420px;
            margin: 0 auto;
            padding: 20px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .nav-card {
            background: var(--card);
            border-radius: 16px;
            padding: 25px 15px;
            text-align: center;
            text-decoration: none;
            color: var(--dark);
            box-shadow: 0 4px 15px var(--shadow);
            transition: all 0.3s ease;
            opacity: 0;
            transform: translateY(20px);
            animation: slideUp 0.6s ease forwards;
        }

        .nav-card:nth-child(1) { animation-delay: 0.1s; }
        .nav-card:nth-child(2) { animation-delay: 0.15s; }
        .nav-card:nth-child(3) { animation-delay: 0.2s; }
        .nav-card:nth-child(4) { animation-delay: 0.25s; }

        .nav-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px var(--shadow);
        }

        .nav-card:nth-child(1):hover { border-bottom: 3px solid var(--primary); }
        .nav-card:nth-child(2):hover { border-bottom: 3px solid var(--secondary); }
        .nav-card:nth-child(3):hover { border-bottom: 3px solid var(--primary); }
        .nav-card:nth-child(4):hover { border-bottom: 3px solid var(--secondary); }

        .nav-icon {
            font-size: 28px;
            margin-bottom: 12px;
        }

        .nav-card:nth-child(1) .nav-icon { color: var(--primary); }
        .nav-card:nth-child(2) .nav-icon { color: var(--secondary); }
        .nav-card:nth-child(3) .nav-icon { color: var(--primary); }
        .nav-card:nth-child(4) .nav-icon { color: var(--secondary); }

        .nav-label {
            font-size: 0.9rem;
            font-weight: 500;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #ffffff;
            display: flex;
            justify-content: space-around;
            padding: 12px 10px 20px;
            box-shadow: 0 -2px 15px rgba(0,0,0,0.05);
            z-index: 100;
        }

        .bot-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #aaa;
            text-decoration: none;
            transition: all 0.3s ease;
        }

      bot-nav-item.active, .bot-nav-item:hover {
            color: var(--primary);
        }

        .bot-nav-item i {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .bot-nav-item span {
            font-size: 0.6rem;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="hero">
        <div class="profile-wrap">
            <img src="profile.jpg" alt="Profile" class="profile-img">
        </div>
        <h1>Biench Pavia
        <p class="tagline">Student • Creator</p>
        <p class="intro-text">Welcome to my personal space — a collection of my works, projects, and journey.</p>
    </div>

    <div class="nav-grid">
        <a href="about.html" class="nav-card">
            <div class="nav-icon"><i class="fas fa-user"></i></div>
            <div class="nav-label">About Me</div>
        </a>
        <a href="works.html" class="nav-card">
            <div class="nav-icon"><i class="fas fa-pen-fancy"></i></div>
            <div class="nav-label">My Works</div>
        </a>
        <a href="projects.html" class="nav-card">
            <div class="nav-icon"><i class="fas fa-folder-open"></i></div>
            <div class="nav-label">Projects</div>
        </a>
        <a href="contact.html" class="nav-card">
            <div class="nav-icon"><i class="fas fa-envelope"></i></div>
            <div class="nav-label">Contact</div>
        </a>
    </div>

    <nav class="bottom-nav">
        <a href="index.html" class="bot-nav-item active">
            <i class="fas fa-home"></i>
            <span>Home</span>
        </a>
        <a href="works.html" class="bot-nav-item">
            <i class="fas fa-book"></i>
            <span>Works</span>
        </a>
        <a href="projects.html" class="bot-nav-item">
            <i class="fas fa-th-large"></i>
            <span>More</span>
        </a>
        <a href="contact.html" class="bot-nav-item">
            <i class="fas fa-user-circle"></i>
            <span>Profile</span>
        </a>
    </nav>

</body>
</html>
